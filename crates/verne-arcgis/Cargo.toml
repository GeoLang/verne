[package]
name = "verne-arcgis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ArcGIS Feature Service inventory and extraction adapter for verne"

[dependencies]
verne-core = { path = "../verne-core" }
# same client as verne-load: rustls rather than the system OpenSSL
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    # form-body building and query-string building are their own features in 0.13
    "form",
    "json",
    "query",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
# best-effort float parsing does not round-trip its own shortest output, and a
# reparsed feature must equal the one that was written: the delta diff and a
# load both reread what an extraction serialised
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
# a Date attribute arrives as epoch milliseconds and is written as RFC 3339
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
