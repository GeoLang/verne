[package]
name = "verne-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command line inventory of third-party geospatial sources"

[[bin]]
name = "verne"
path = "src/main.rs"

[features]
# Off by default: GDAL is a system library, and the KML side needs none.
default = []
gdb = ["dep:verne-gdb", "verne-gdb/gdal"]

[dependencies]
verne-core = { path = "../verne-core" }
verne-kml = { path = "../verne-kml" }
verne-load = { path = "../verne-load" }
verne-gdb = { path = "../verne-gdb", optional = true }
clap = { version = "4", features = ["derive"] }
