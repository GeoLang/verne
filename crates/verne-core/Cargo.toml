[package]
name = "verne-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Inventory model and report rendering for verne"

[dependencies]
serde = { version = "1", features = ["derive"] }
# best-effort float parsing does not round-trip its own shortest output, and a
# reparsed feature must equal the one that was written: the delta diff and a
# load both reread what an extraction serialised
serde_json = { version = "1", features = ["float_roundtrip"] }
time = { version = "0.3", features = ["formatting"] }
