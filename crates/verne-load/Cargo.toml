[package]
name = "verne-load"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Load a verne sidecar into a running ptolemy"

[dependencies]
verne-core = { path = "../verne-core" }
# matches sibyl and tiletopia: one HTTP client across the platform, rustls
# rather than the system OpenSSL
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
# ptolemy takes an attachment's bytes as base64 in the JSON body
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
# the live test mints its own feature ids, as an extraction does
uuid = { version = "1", features = ["v7"] }
