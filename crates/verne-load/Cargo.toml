[package]
name = "verne-load"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Load a verne sidecar into a running ptolemy"

[dependencies]
verne-core = { path = "../verne-core" }
# matches sibyl and tiletopia: one HTTP client across the platform, rustls
# rather than the system OpenSSL
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "json",
    "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
